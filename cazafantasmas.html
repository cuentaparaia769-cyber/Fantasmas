<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscador de fantasmas</title>
<style>
:root{--bg:#f1ede6;--tx:#1a1620;--mu:#6b6475;--cd:#fff;--bd:#d9d2c8;--ac:#7a1f2b;--ok:#2f7d4f;--no:#8a8190;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b10;--tx:#e9e4ee;--mu:#9a92a6;--cd:#181421;--bd:#2c2536;--ac:#d03a48;--ok:#4cc17f;--no:#6d6578}}
:root[data-theme="dark"]{--bg:#0d0b10;--tx:#e9e4ee;--mu:#9a92a6;--cd:#181421;--bd:#2c2536;--ac:#d03a48;--ok:#4cc17f;--no:#6d6578}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:920px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:Georgia,serif;text-align:center;margin:8px 0 4px;font-size:1.8rem}
.sub{text-align:center;color:var(--mu);margin:0 0 24px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.game{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:18px;text-align:center;cursor:pointer;color:inherit;font:inherit;transition:transform .15s,border-color .15s}
.game:hover{transform:translateY(-3px);border-color:var(--ac)}
.game svg{width:100%;height:auto;max-height:150px;border-radius:10px}
.game b{display:block;margin-top:10px;font-size:1.1rem}
.game span{color:var(--mu);font-size:.9rem}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit}
.top svg{height:54px;width:auto;border-radius:8px}
.ev{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:999px;padding:8px 14px;cursor:pointer;font:inherit;font-size:.92rem}
.chip.f{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--cd))}
.chip.x{border-color:var(--no);color:var(--mu);text-decoration:line-through}
.hint{color:var(--mu);font-size:.85rem;margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}
.reset{background:none;border:none;color:var(--ac);cursor:pointer;font:inherit;text-decoration:underline}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gh{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px}
.gh h3{margin:0 0 6px;font-family:Georgia,serif}
.gh p{margin:8px 0 0;font-size:.9rem;color:var(--mu)}
.tag{display:inline-block;font-size:.78rem;border:1px solid var(--bd);border-radius:6px;padding:1px 7px;margin:0 4px 4px 0}
.tag.f{border-color:var(--ok);color:var(--ok)}
.none{padding:20px;text-align:center;color:var(--mu)}
.note{font-size:.8rem;color:var(--mu);margin-top:22px;text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<script>
var LOGO={
p:'<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="150" fill="#0b0f14"/><circle cx="200" cy="38" r="20" fill="none" stroke="#9fd6e8" stroke-width="3" opacity=".8"/><path d="M190 52q10 10 20 0" stroke="#9fd6e8" stroke-width="3" fill="none"/><text x="200" y="108" text-anchor="middle" font-family="Georgia,serif" font-size="40" letter-spacing="3" fill="#e6f4f9">PHASMOPHOBIA</text><text x="200" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" letter-spacing="6" fill="#6aa6bb">LOGO PROVISIONAL</text></svg>',
d:'<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="150" fill="#140808"/><path d="M200 18l22 34h-44z" fill="none" stroke="#c4323f" stroke-width="3"/><circle cx="200" cy="40" r="5" fill="#c4323f"/><text x="200" y="108" text-anchor="middle" font-family="Georgia,serif" font-size="38" letter-spacing="3" fill="#f3dede">DEMONOLOGIST</text><text x="200" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" letter-spacing="6" fill="#b4545c">LOGO PROVISIONAL</text></svg>'};
var G={
p:{name:'Phasmophobia',ev:{emf:'EMF 5',box:'Spirit Box',uv:'Ultravioleta',orb:'Orbes',wri:'Escritura',fre:'Temp. bajo cero',dot:'DOTS'},
gh:[
['Espíritu','emf box wri','Sin rasgos especiales. El incienso lo detiene más tiempo (180 s).'],
['Wraith','emf box dot','Casi nunca toca el suelo y puede teletransportarse hacia un jugador. Evita la sal.'],
['Phantom','box uv dot','Mirarlo baja mucho la cordura. Desaparece al fotografiarlo.'],
['Poltergeist','box uv wri','Lanza muchos objetos a la vez; débil si no hay objetos cerca.'],
['Banshee','uv orb dot','Elige un solo objetivo y lo persigue. Chilla en el micrófono parabólico.'],
['Jinn','emf uv fre','Más rápido si ve al jugador y hay electricidad activa.'],
['Mare','box orb wri','Prefiere la oscuridad: caza antes y con más fuerza con las luces apagadas.'],
['Revenant','orb wri fre','Muy lento si no te ve, muy rápido cuando te persigue.'],
['Shade','emf wri fre','Tímido: poca actividad si hay gente cerca y casi no caza con varios en la sala.'],
['Demon','uv wri fre','Muy agresivo: puede cazar con la cordura alta.'],
['Yurei','orb fre dot','Drena la cordura rápido. El incienso lo encierra en su sala.'],
['Oni','emf fre dot','Muy activo; más activo con gente cerca y sus manifestaciones se ven más.'],
['Yokai','box orb dot','Se enfada con ruido cerca; en caza solo oye a los que hablan cerca.'],
['Hantu','uv orb fre','Más rápido en frío y más lento en calor.'],
['Goryo','emf uv dot','Su DOTS solo se ve por cámara y rara vez se aleja de su sala.'],
['Myling','emf uv wri','Muy ruidoso durante la caza (pasos y sonidos frecuentes).'],
['Onryo','box orb fre','Teme las llamas: apagarlas lo empuja a cazar.'],
['The Twins','emf box fre','Son dos entidades que pueden interactuar a la vez en sitios distintos.'],
['Raiju','emf orb dot','Más rápido cerca de aparatos electrónicos encendidos.'],
['Obake','emf uv orb','Deja huellas poco habituales y puede cambiar de forma.'],
['The Mimic','box uv fre','Imita a otros fantasmas y siempre muestra Orbes falsos como 4.ª prueba.'],
['Moroi','box wri fre','Más rápido con la cordura baja; maldice a quien usa la Spirit Box.'],
['Deogen','box wri dot','Siempre sabe dónde estás; muy lento cuando te alcanza.'],
['Thaye','orb wri dot','Envejece: se vuelve más débil y lento con el tiempo.']]},
d:{name:'Demonologist',ev:{emf:'EMF 5',fin:'Huellas',dra:'Dibujo (caballete)',fre:'Temp. helada',esg:'Reacción ESG',ect:'Ectoplasma',box:'Spirit Box'},
gh:[['Abaddon','emf fre box'],['Agash','ect fin fre'],['Boogey','emf esg box'],['Demon','dra ect fre'],['Deogen','esg ect fin'],['Goryo','emf esg fin'],['Guipo','esg ect box'],['Gul','fin box fre'],['Hantu','dra box fre'],['Iblis','esg dra box'],['Jinn','emf esg fre'],['Mare','emf dra fre'],['Myling','ect box fre'],['Naamah','esg dra ect'],['Oni','emf fin fre'],['Onryo','emf fin dra'],['Poltergeist','esg fin box'],['Raiju','esg ect fre'],['Revenant','dra fin fre'],['Shade','dra ect box'],['Thaye','dra fin box'],['Wraith','emf ect fin'],['Yokai','emf dra box'],['Yurei','emf esg ect']]}};
var st={p:{},d:{}};
var app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function home(){
app.innerHTML='<h1>Buscador de fantasmas</h1><p class="sub">Elige tu juego</p><div class="games">'+
['p','d'].map(function(k){return '<button class="game" data-g="'+k+'">'+LOGO[k]+'<b>'+G[k].name+'</b><span>'+G[k].gh.length+' fantasmas</span></button>'}).join('')+'</div>'+
'<p class="note">Los logos son provisionales; puedes cambiarlos por los oficiales.</p>';
app.querySelectorAll('.game').forEach(function(b){b.onclick=function(){location.hash=b.dataset.g==='p'?'phasmophobia':'demonologist'}});
}
function game(k){
var g=G[k],s=st[k];
function match(x){var e=x[1].split(' ');
for(var c in s){if(s[c]===1&&e.indexOf(c)<0&&!(k==='p'&&x[0]==='The Mimic'&&c==='orb'))return false;
if(s[c]===2&&e.indexOf(c)>=0)return false}return true}
var res=g.gh.filter(match);
var html='<div class="top"><button class="back" id="bk">← Juegos</button>'+LOGO[k]+'</div>'+
'<p class="hint">Toca una prueba una vez para marcarla como encontrada ✓ y otra vez para descartarla ✗.</p><div class="ev">'+
Object.keys(g.ev).map(function(c){var v=s[c]||0;return '<button class="chip'+(v===1?' f':v===2?' x':'')+'" data-c="'+c+'">'+(v===1?'✓ ':v===2?'✗ ':'')+esc(g.ev[c])+'</button>'}).join('')+'</div>'+
'<div class="bar"><b>'+res.length+' de '+g.gh.length+' posibles</b><button class="reset" id="rs">Reiniciar</button></div>';
html+=res.length?'<div class="list">'+res.map(function(x){
return '<div class="gh"><h3>'+esc(x[0])+'</h3>'+x[1].split(' ').map(function(c){return '<span class="tag'+(s[c]===1?' f':'')+'">'+esc(g.ev[c])+'</span>'}).join('')+
'<p>'+(x[2]?esc(x[2]):'Comportamiento: lo añadimos en la siguiente parte.')+'</p></div>'}).join('')+'</div>':'<div class="none">Ningún fantasma encaja con esa combinación. Revisa las pruebas marcadas.</div>';
if(k==='d')html+='<p class="note">Datos de pruebas según guías de la comunidad; el juego recibe actualizaciones y pueden cambiar.</p>';
else html+='<p class="note">Datos de la versión actual de Phasmophobia, de memoria; conviene contrastarlos con guiaphasmophobia.com.</p>';
app.innerHTML=html;
document.getElementById('bk').onclick=function(){location.hash=''};
document.getElementById('rs').onclick=function(){st[k]={};game(k)};
app.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){var c=b.dataset.c;s[c]=((s[c]||0)+1)%3;game(k)}});
}
function route(){var h=location.hash.replace('#','');window.scrollTo(0,0);
if(h==='phasmophobia')game('p');else if(h==='demonologist')game('d');else home()}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
